# ==============================================================================
# ARCH LINUX INSTALLER - CONFIGURATION VARIABLES (vars.conf)
# You can edit the values below or accept the defaults.
# Passwords can be filled here or left empty to prompt securely during install.
# ==============================================================================

# ------------------------------------------------------------------------------
# Mirrors & Pacman Configuration
# ------------------------------------------------------------------------------
PARALLEL_DOWNLOADS=5
REFLECTOR_ENABLED=true
REFLECTOR_COUNTRY="Worldwide"    # e.g. "Worldwide" or "Philippines,Singapore"

# ------------------------------------------------------------------------------
# System & Localization
# ------------------------------------------------------------------------------
HOSTNAME="arch"
TIMEZONE="Asia/Manila"           # e.g. "Asia/Manila", "UTC", "America/New_York"
LOCALE="en_US.UTF-8"             # e.g. "en_US.UTF-8" or "fil_PH.UTF-8"
LANG="en_US.UTF-8"               # e.g. "en_US.UTF-8" or "fil_PH.UTF-8"
KEYMAP="us"                      # e.g. "us", "uk", "de"

# ------------------------------------------------------------------------------
# Filesystem & Storage
# ------------------------------------------------------------------------------
FS_TYPE="btrfs"                  # Choose between "btrfs" or "ext4" only
SEPARATE_HOME=false              # false = combined in root (DEFAULT), true = separate /home
ROOT_SIZE="80G"                  # Size of root if separate /home is selected

# ------------------------------------------------------------------------------
# Disk Encryption (LUKS) & LVM
# ------------------------------------------------------------------------------
LUKS_ENABLED=false               # Set to true if you want full disk/partition encryption
LUKS_NAME="cryptroot"
LVM_ENABLED=false                # Set to true if you want filesystem inside LVM
LVM_VG="vg0"

# ------------------------------------------------------------------------------
# Bootloader
# ------------------------------------------------------------------------------
BOOTLOADER="systemd-boot"        # "systemd-boot" (recommended for UEFI) or "grub"

# ------------------------------------------------------------------------------
# User Accounts & Passwords
# (Leave empty to prompt interactively and securely during installation)
# ------------------------------------------------------------------------------
ROOT_PASSWORD=""

USERNAME="alvin"
USER_PASSWORD=""
USER_SHELL="/bin/bash"           # e.g. "/bin/bash" or "/bin/zsh"
USER_GROUPS="wheel,storage,power"
SUDO_NOPASSWD=false              # Set to true for passwordless sudo

# ------------------------------------------------------------------------------
# Systemd Services to Enable
# ------------------------------------------------------------------------------
SERVICES="NetworkManager"

